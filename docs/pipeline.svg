<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" width="680" height="476" role="img">
  <title>Queens 求解器处理链路</title>
  <desc>支持两类输入：谜题文件经 IO 解析、谜题截图经截图识别，都汇入 QueensPuzzle；随后逻辑求解或暴力回溯求解，最后输出棋盘与难度评级。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">

    <rect x="40" y="40" width="250" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="165" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">谜题文件</text>
    <text x="165" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">文本网格 · 归档 JSON</text>

    <rect x="390" y="40" width="250" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="515" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">谜题截图</text>
    <text x="515" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">PNG · JPG · WebP</text>

    <path d="M165 96 V126" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M515 96 V126" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="40" y="130" width="250" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="165" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#B5D4F4">IO 解析</text>
    <text x="165" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85B7EB">io::text · archived_queens</text>

    <rect x="390" y="130" width="250" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="515" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#B5D4F4">截图识别</text>
    <text x="515" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85B7EB">彩色 mask + 投影 / 梯度回退</text>

    <path d="M165 186 V203 H340 V216" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M515 186 V203 H340 V216" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="215" y="220" width="250" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">QueensPuzzle</text>
    <text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">网格 · 区域 · 状态</text>

    <path d="M340 276 V293 H165 V306" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M340 276 V293 H515 V306" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="40" y="310" width="250" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="165" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#B5D4F4">逻辑求解</text>
    <text x="165" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85B7EB">5 类规则 · 14 条实例</text>

    <rect x="390" y="310" width="250" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="515" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#B5D4F4">暴力回溯</text>
    <text x="515" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85B7EB">逻辑失效时兜底</text>

    <path d="M165 366 V383 H340 V396" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M515 366 V383 H340 V396" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="215" y="400" width="250" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">CLI 输出</text>
    <text x="340" y="436" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">棋盘 + 难度评级</text>

  </g>
</svg>
